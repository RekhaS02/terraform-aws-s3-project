<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Rekha S.</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,800;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f3;
      --navy: #1a2540;
      --teal: #0f766e;
      --teal-light: #14b8a6;
      --teal-pale: #f0fdfa;
      --muted: #6b7280;
      --border: #e5e7eb;
      --ff-display: 'Fraunces', Georgia, serif;
      --ff-body: 'Outfit', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--navy);
      font-family: var(--ff-body);
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      text-align: center;
      padding: 2rem;
    }

    /* Dot grid background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(15,118,110,.08) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow */
    .glow {
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(20,184,166,.1), transparent 70%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: glowPulse 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes glowPulse { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.15)} }

    .container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
      animation: fadeUp .9s ease forwards;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }

    .err-num {
      font-family: var(--ff-display);
      font-size: clamp(7rem, 22vw, 14rem);
      font-weight: 800;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px rgba(15,118,110,.25);
      letter-spacing: -.04em;
      user-select: none;
      animation: floatNum 6s ease-in-out infinite;
    }
    @keyframes floatNum { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

    .err-badge {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .35rem .9rem;
      background: var(--teal-pale);
      border: 1px solid rgba(15,118,110,.2);
      border-radius: 999px;
      font-size: .75rem; font-weight: 500; color: var(--teal);
      letter-spacing: .06em;
      animation: fadeUp .7s .2s ease both;
    }
    .err-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal-light); animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .err-title {
      font-family: var(--ff-display);
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 600; line-height: 1.2;
      animation: fadeUp .7s .3s ease both;
    }
    .err-title em { font-style: italic; color: var(--teal); }

    .err-sub {
      color: var(--muted); font-size: .95rem;
      max-width: 400px; line-height: 1.7;
      animation: fadeUp .7s .45s ease both;
    }

    .err-actions {
      display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
      margin-top: .5rem;
      animation: fadeUp .7s .6s ease both;
    }
    .btn-primary {
      padding: .75rem 2rem;
      background: var(--teal); color: #fff;
      font-family: var(--ff-body); font-size: .85rem; font-weight: 500;
      letter-spacing: .06em; border: none; cursor: pointer;
      transition: background .3s, transform .2s; display: inline-block;
      text-decoration: none;
    }
    .btn-primary:hover { background: var(--navy); transform: translateY(-2px); }
    .btn-outline {
      padding: .75rem 2rem;
      border: 1.5px solid var(--navy); color: var(--navy);
      font-family: var(--ff-body); font-size: .85rem; font-weight: 500;
      letter-spacing: .06em;
      transition: background .3s, color .3s, transform .2s; display: inline-block;
      text-decoration: none;
    }
    .btn-outline:hover { background: var(--navy); color: #fff; transform: translateY(-2px); }

    .err-footer {
      margin-top: 3rem;
      font-size: .75rem; color: var(--muted);
      animation: fadeUp .7s .75s ease both;
    }
    .err-footer span { color: var(--teal); font-weight: 500; }

    /* Floating particles */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: var(--teal);
      border-radius: 50%;
      opacity: 0;
      animation: drift var(--dur) var(--delay) ease-in-out infinite;
    }
    @keyframes drift {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      20%  { opacity: .35; }
      80%  { opacity: .2; }
      100% { opacity: 0; transform: translateY(-120px) scale(.5); }
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="err-badge"><div class="dot"></div> Page Not Found</div>
    <div class="err-num">404</div>
    <h1 class="err-title">Oops! This page<br>doesn't <em>exist.</em></h1>
    <p class="err-sub">Looks like you've ventured into unknown territory. The page you're looking for may have been moved, deleted, or never existed.</p>
    <div class="err-actions">
      <a href="index.html" class="btn-primary">← Back to Home</a>
      <a href="mailto:rekhasridhar31@gmail.com" class="btn-outline">Contact Me</a>
    </div>
    <p class="err-footer">Rekha S. · <span>Data Analyst & Data Scientist</span> · Palakkad, Kerala</p>
  </div>

  <script>
    // Generate floating particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${40 + Math.random() * 50}%;
        --dur: ${4 + Math.random() * 5}s;
        --delay: ${Math.random() * 6}s;
        width: ${2 + Math.random() * 4}px;
        height: ${2 + Math.random() * 4}px;
        opacity: 0;
      `;
      container.appendChild(p);
    }
  </script>
</body>
</html>
